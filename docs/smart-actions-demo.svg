<svg xmlns="http://www.w3.org/2000/svg" width="768" height="328" viewBox="0 0 768 328" role="img" aria-labelledby="demo-title demo-desc">
  <title id="demo-title">Smart Actions writes a classification and urgency score to a selected row</title>
  <desc id="demo-desc">Select the duplicate charge request, open the row context menu, and run Classify message and assess urgency. Review the suggested values and apply them. The row receives billing in Category and 2.5 in Urgency.</desc>
  <defs>
    <filter id="popover-shadow" x="-15%" y="-20%" width="130%" height="155%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f383f" flood-opacity=".17"/>
    </filter>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #19282e; font-size: 15px; }
      .label { font-weight: 650; }
      .muted { fill: #52646a; }
      .small { font-size: 13px; }
      .ring, .cursor, .menu, .review, .phase { opacity: 0; }
      .selected, .results { opacity: 1; }

      @media (prefers-reduced-motion: no-preference) {
        .selected { animation: select-row 10s linear infinite; }
        .cursor { animation: move-pointer 10s ease-in-out infinite; }
        .ring { animation: show-right-click 10s linear infinite; }
        .menu { animation: show-menu 10s linear infinite; }
        .review { animation: show-review 10s linear infinite; }
        .results { animation: show-results 10s linear infinite; }
        .phase-select { animation: select-step 10s linear infinite; }
        .phase-menu { animation: show-menu 10s linear infinite; }
        .phase-review { animation: show-review 10s linear infinite; }
        .phase-results { animation: show-results 10s linear infinite; }
      }

      @keyframes select-row {
        0%, 9%, 100% { opacity: 0; }
        12%, 95% { opacity: 1; }
      }
      @keyframes show-right-click {
        0%, 22%, 30%, 100% { opacity: 0; }
        24% { opacity: 1; }
      }
      @keyframes show-menu {
        0%, 24%, 48%, 100% { opacity: 0; }
        27%, 45% { opacity: 1; }
      }
      @keyframes show-review {
        0%, 48%, 77%, 100% { opacity: 0; }
        52%, 74% { opacity: 1; }
      }
      @keyframes show-results {
        0%, 75%, 100% { opacity: 0; }
        78%, 96% { opacity: 1; }
      }
      @keyframes select-step {
        0%, 23% { opacity: 1; }
        26%, 100% { opacity: 0; }
      }
      @keyframes move-pointer {
        0% { opacity: 0; transform: translate(94px, 166px); }
        4% { opacity: 1; transform: translate(94px, 166px); }
        11%, 14% { opacity: 1; transform: translate(48px, 125px); }
        24%, 28% { opacity: 1; transform: translate(202px, 136px); }
        37%, 46% { opacity: 1; transform: translate(532px, 219px); }
        48% { opacity: 0; transform: translate(532px, 219px); }
        54% { opacity: 0; transform: translate(470px, 214px); }
        59% { opacity: 1; transform: translate(470px, 214px); }
        69%, 75% { opacity: 1; transform: translate(539px, 228px); }
        81%, 100% { opacity: 0; transform: translate(572px, 187px); }
      }
    </style>
  </defs>

  <rect x=".5" y=".5" width="767" height="327" rx="16" fill="#f5f8f9" stroke="#d8e2e5"/>
  <g fill="none" stroke="#496067" stroke-linecap="round" stroke-width="1.5">
    <rect x="25" y="22" width="17" height="16" rx="3"/>
    <path d="M25 28h17m-11 0v10m5-10v10"/>
  </g>
  <text class="label" x="52" y="35">Requests</text>
  <path d="m132 27 4 4-4 4" fill="none" stroke="#829297" stroke-width="1.5"/>
  <text class="muted" x="147" y="35">Try it</text>

  <rect x="24" y="55" width="720" height="195" rx="8" fill="#fff" stroke="#d5dfe2"/>
  <rect class="selected" x="25" y="91" width="718" height="53" fill="#e9f6f4"/>
  <path d="M24 90.5h720m-720 54h720m-720 54h720M70.5 55v195m377-195v195m149-195v195" fill="none" stroke="#dce5e7"/>
  <rect class="selected" x="25.5" y="91.5" width="717" height="52" fill="none" stroke="#74b8ad"/>

  <text class="label" x="88" y="78">Message</text>
  <text class="label" x="466" y="78">Category</text>
  <text class="label" x="616" y="78">Urgency</text>

  <g class="muted small" text-anchor="middle">
    <text x="47" y="123">1</text>
    <text x="47" y="177">2</text>
    <text x="47" y="230">3</text>
  </g>
  <g class="selected">
    <rect x="38" y="108" width="18" height="18" rx="4" fill="#16796e"/>
    <path d="m42 117 3 3 6-7" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="88" y="113">I was billed twice for my subscription.</text>
  <text x="88" y="133">Can you refund the second charge?</text>
  <text x="88" y="178">Could you send a quote for 25 seats?</text>
  <text x="88" y="231">How do I export the filtered rows?</text>

  <g class="results">
    <rect x="464" y="104" width="64" height="26" rx="6" fill="#cbece6"/>
    <text class="label" x="496" y="122" text-anchor="middle" fill="#125951">billing</text>
    <text class="label" x="617" y="122" fill="#125951">2.5</text>
  </g>

  <circle class="ring" cx="202" cy="136" r="12" fill="none" stroke="#16796e" stroke-width="2"/>
  <g class="menu">
    <rect x="199" y="147" width="350" height="96" rx="10" fill="#fff" stroke="#d5dfe2" filter="url(#popover-shadow)"/>
    <text class="small muted" x="216" y="169">Row actions</text>
    <text x="245" y="192">Copy row</text>
    <path d="M217 185h11v10h-11zm3-3h11v9" fill="none" stroke="#64777c" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="207" y="202" width="334" height="32" rx="6" fill="#e3f3ef"/>
    <path d="M223 208v5m0 8v5m-9-9h5m8 0h5m-15-6 3 3m6 6 3 3m0-12-3 3m-6 6-3 3" fill="none" stroke="#16796e" stroke-width="1.4" stroke-linecap="round"/>
    <text class="label" x="245" y="223">Classify message and assess urgency</text>
  </g>

  <g class="review">
    <rect x="198" y="104" width="372" height="146" rx="12" fill="#fff" stroke="#d5dfe2" filter="url(#popover-shadow)"/>
    <text class="label" x="217" y="130">Review proposed changes</text>
    <text class="muted small" x="217" y="156">Category</text>
    <text class="muted small" x="389" y="156">Urgency</text>
    <rect x="216" y="167" width="154" height="28" rx="6" fill="#e9f6f4"/>
    <rect x="388" y="167" width="162" height="28" rx="6" fill="#e9f6f4"/>
    <text class="label" x="228" y="186">billing</text>
    <text class="label" x="400" y="186">2.5</text>
    <rect x="466" y="208" width="84" height="29" rx="6" fill="#16796e"/>
    <text class="label small" x="508" y="227" text-anchor="middle" style="fill:#fff">Apply</text>
  </g>

  <g class="cursor" aria-hidden="true">
    <path d="M0 0v22l5-5 4 8 4-2-4-8h8Z" fill="#19282e" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
  </g>

  <g aria-hidden="true">
    <path d="M25 277h169m14 0h169m14 0h169m14 0h169" stroke="#d6e2e4" stroke-width="3" stroke-linecap="round"/>
    <path class="phase phase-select" d="M25 277h169" stroke="#16796e" stroke-width="3" stroke-linecap="round"/>
    <path class="phase phase-menu" d="M208 277h169" stroke="#16796e" stroke-width="3" stroke-linecap="round"/>
    <path class="phase phase-review" d="M391 277h169" stroke="#16796e" stroke-width="3" stroke-linecap="round"/>
    <path class="phase phase-results" d="M574 277h169" stroke="#16796e" stroke-width="3" stroke-linecap="round"/>
    <text class="small label" x="24" y="305">Select a row</text>
    <text class="small label" x="207" y="305">Right-click and run</text>
    <text class="small label" x="390" y="305">Review and apply</text>
    <text class="small label" x="573" y="305">See the results</text>
  </g>
</svg>
